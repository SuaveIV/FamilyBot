name: Supply Chain Security Checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'uv.lock'
      - 'src/**/*.py'
      - 'scripts/**/*.py'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest
    name: Security Scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify uv.lock is consistent with pyproject.toml
        run: |
          uv lock --check
          echo "uv.lock verified"

      - name: Verify hash-pinned lockfile
        run: |
          if ! grep -qF -- '--hash=' requirements-hashes.txt; then
            echo "Error: requirements-hashes.txt does not contain --hash= entries"
            echo "Regenerate with: just lock-hashes"
            exit 1
          fi
          echo "Hash-pinned lockfile verified"

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements-hashes.txt

      - name: Run Ruff security linting (S rules)
        run: |
          uv run ruff check --select S src/ scripts/ || echo "Pre-existing S-rule violations (non-blocking)"
        continue-on-error: true

      - name: Run full Ruff linting (all configured rules)
        run: |
          uv run ruff check src/ scripts/ || echo "Pre-existing lint violations (non-blocking)"
        continue-on-error: true

      - name: Run uv audit for vulnerable dependencies
        run: |
          uv audit --preview-features audit-command --locked || { echo "Vulnerabilities found"; exit 1; }
        continue-on-error: false

      - name: Generate CycloneDX SBOM (Software Bill of Materials)
        run: |
          uv export --extra dev --format cyclonedx1.5 -o sbom.json || echo "SBOM generation skipped"
          ls -la sbom.json 2>/dev/null && echo "SBOM generated: sbom.json"

      - name: Upload SBOM as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Dependency Review

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: Apache-2.0,Apache-2.0 WITH LLVM-exception,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT AND BSD-2-Clause,MPL-2.0,Python-2.0,Unlicense,0BSD,CC0-1.0,CC-BY-4.0,CC-BY-SA-4.0,PSF-2.0,Zlib,LGPL-2.1-only,GPL-1.0-or-later,GPL-2.0-only,LicenseRef-scancode-public-domain

  comment-on-pr:
    if: always() && github.event_name == 'pull_request'
    needs: [security, dependency-review]
    runs-on: ubuntu-latest
    name: Security Summary

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post security check summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const securityResult = '${{ needs.security.result }}';
            const depReviewResult = '${{ needs.dependency-review.result }}';

            let comment;
            if (securityResult === 'success' && depReviewResult === 'success') {
              comment = `## Supply Chain Security Status

            Checks Performed:
            - uv lock --check (lockfile consistency)
            - Hash-pinned lockfile verification
            - uv audit against OSV vulnerability database
            - CycloneDX SBOM generation

            Best Practices:
            - Dependencies pinned with hashes in requirements-hashes.txt
            - uv.lock committed as single source of truth
            - Automated vulnerability scanning on every push/PR

            Learn more: https://bernat.tech/posts/securing-python-supply-chain/`;
            } else {
              const failures = [];
              if (securityResult !== 'success') failures.push('- Security scanning (uv audit)');
              if (depReviewResult !== 'success') failures.push('- Dependency review');

              comment = `## Supply Chain Security Check Failed

            Failed checks:
            ${failures.join('\n')}

            Please review the GitHub Actions logs for details and resolve the issues before merging.`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });